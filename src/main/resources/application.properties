spring.application.name=campus-mess
spring.datasource.url=${MESS_DB_URL:jdbc:postgresql://localhost:5432/campus_mess}
spring.datasource.username=${MESS_DB_USER:campus}
spring.datasource.password=${MESS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=12
spring.sql.init.mode=always
server.address=${MESS_BIND:127.0.0.1}
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
mess.zone=${MESS_ZONE:Asia/Karachi}
mess.escalation=${MESS_ESCALATION:PT48H}
mess.scheduling=true
spring.mvc.log-request-details=false
logging.level.org.springframework.jdbc.core=INFO
