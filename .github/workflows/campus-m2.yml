name: Campus M2 verification
on:
  push:
    branches: [Menu-notifications-feedback]
  pull_request:
    paths:
      - 'src/**/com/giki/mess/campus/**'
      - 'src/main/resources/**'
      - 'pom.xml'
      - '.github/workflows/campus-m2.yml'
permissions:
  contents: read
jobs:
  campus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: ci-local-fixture
          POSTGRES_DB: campus_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      MESS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/campus_test
      MESS_DB_USER: campus
      MESS_DB_PASSWORD: ci-local-fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify pmd:pmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campus-m2-results
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pmd.xml
            target/reports/pmd*
